name: imovel-bot

# Só roda sob demanda (workflow_dispatch) — sem schedule/cron. Decisão
# explícita do usuário: rodar 3x/dia era gasto desnecessário, prefere
# disparar manualmente (inclusive do celular, via botão "Rodar agora"
# no próprio dashboard) só quando quiser ver resultado novo.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier a rodar"
        type: choice
        options:
          - "1"
          - "3"
        default: "1"
      enviar_telegram:
        description: "Enviar notificações reais pro Telegram?"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações no Pages disputando ao mesmo tempo; não
# cancela um deploy em andamento pra não deixar o site pela metade.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/vistos.db
          key: imovel-bot-db-${{ github.run_id }}
          restore-keys: |
            imovel-bot-db-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN:           ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL_MERCADO: ${{ secrets.TELEGRAM_CHANNEL_MERCADO }}
          TELEGRAM_CHANNEL_LEILAO:  ${{ secrets.TELEGRAM_CHANNEL_LEILAO }}
        run: |
          ARGS="--tier ${{ inputs.tier }}"
          if [ "${{ inputs.enviar_telegram }}" != "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Save DB cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/vistos.db
          key: imovel-bot-db-${{ github.run_id }}

      - name: Montar site para o GitHub Pages
        # data/dashboard.html é gerado pelo passo "Run bot" acima (sempre,
        # mesmo em dry-run — ver notifier/dashboard.py). Junta com os
        # assets do PWA (pwa/) num diretório único a publicar; nunca
        # publica data/ inteiro (teria vistos.db e HTMLs de debug).
        run: |
          mkdir -p site
          cp data/dashboard.html site/index.html
          cp pwa/manifest.webmanifest pwa/sw.js pwa/icon.svg site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-bot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
